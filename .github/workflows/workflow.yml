name: Demo CI/CD Pipeline
on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Source Code Checkout
        uses: actions/checkout@v3

      - name: Log to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/demo-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/demo-backend:latest

      - name: Build and Push frontend image
        run: |
          docker build --build-arg VITE_API_URL=http://${{ secrets.EC2_HOST }}:8080 -t ${{ secrets.DOCKER_USERNAME }}/demo-frontend:latest ./frontend
          docker build -t ${{ secrets.DOCKER_USERNAME }}/demo-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/demo-frontend:latest

      # 아주 간단한 방식으로 배포한다. EC2 Instance에 직접 Docker, docker-compose를 설치하고 git clone을 통해
      # 코드를 옮겨둘 필요가 있다. 당연히 좋은 방법은 아니다.
      - name: Deploy to EC2 Instance
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/demo
            
            git fetch --all
            git reset --hard origin/master
            
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
            
            docker compose pull
            docker compose up -d