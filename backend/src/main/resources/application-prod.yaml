spring:
  datasource:
    url: jdbc:mysql://db:3306/memodb?useSSL=false&serverTimezone=Asia/Seoul
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  data:
    redis:
      host: redis
      port: 6379

logging:
  level:
    root: warn
    com.example.backend: info