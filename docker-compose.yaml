services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: memodb
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    restart: always

  backend:
    image: ${DOCKER_USERNAME}/demo-backend:latest
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: always

  frontend:
    image: ${DOCKER_USERNAME}/demo-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  mysql_data: